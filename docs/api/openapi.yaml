openapi: 3.1.0
info:
  title: AGAT PRINT API
  version: 0.7.0
servers:
  - url: /api/v1
paths:
  /auth/csrf:
    get:
      summary: Issue a CSRF cookie and token
      responses: { "200": { description: Token issued } }
  /auth/otp/request:
    post:
      summary: Request a phone OTP
      responses:
        {
          "202": { description: Accepted },
          "429": { description: Rate limited },
        }
  /auth/otp/verify:
    post:
      summary: Verify OTP and create a session
      responses:
        {
          "200": { description: Authenticated },
          "401": { description: Invalid OTP },
        }
  /auth/refresh:
    post:
      summary: Rotate refresh token
      responses:
        {
          "200": { description: Rotated },
          "401": { description: Invalid or reused token },
        }
  /auth/logout:
    post:
      summary: Revoke current session
      responses: { "204": { description: Logged out } }
  /profile:
    get:
      summary: Read current profile
      responses: { "200": { description: Profile } }
  /partners:
    post:
      summary: Submit partner application with initial branch
      responses: { "201": { description: Pending partner created } }
  /partners/me:
    get:
      summary: Read own partner application/workspace status
      responses: { "200": { description: Partner status } }
  /admin/partners/{partnerId}/approve:
    post:
      summary: Approve partner and grant role atomically
      parameters:
        - in: path
          name: partnerId
          required: true
          schema: { type: string, format: uuid }
      responses:
        {
          "200": { description: Approved },
          "403": { description: Admin required },
        }
  /uploads:
    post:
      summary: Reserve quota and create a protected upload session
      description: Original filenames are not accepted or stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUploadSession" }
      responses:
        "201":
          description: Upload session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSession" }
        "400": { description: Unsupported extension or invalid input }
        "413": { description: File or active-user quota exceeded }
        "401": { description: Authentication required }
  /uploads/{uploadId}/content:
    put:
      summary: Stream one upload into private quarantine and finalize validation
      description: >-
        Requires an exact reserved size. The server validates extension,
        declared MIME, signature and bounded structure, then requires a clean
        antivirus verdict before promotion and atomic queue creation.
      parameters:
        - $ref: "#/components/parameters/UploadId"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 26214400 }
      responses:
        "200":
          description: Accepted and queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueuedUpload" }
        "409": { description: Session is no longer writable }
        "413": { description: Reserved or configured size exceeded }
        "422":
          description: Signature, structure, page, pixel or antivirus rejection
        "503": { description: Antivirus unavailable; promotion denied }
  /uploads/{uploadId}:
    delete:
      summary: Cancel an owned upload and remove private objects idempotently
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "204": { description: Cancelled and cleanup requested }
        "403": { description: Upload belongs to another user }
        "404": { description: Upload does not exist }
        "409": { description: Upload can no longer be cancelled }
  /layouts:
    post:
      summary: Preflight one owned stage-3-ready file
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateLayout" }
      responses:
        "201": { description: Current layout revision }
        "409": { description: Stage 3 file not ready or revision changed }
  /layouts/{layoutId}:
    get:
      summary: Read an owned layout without storage identifiers
      parameters: [{ $ref: "#/components/parameters/LayoutId" }]
      responses:
        "200": { description: Current layout revision }
        "404": { description: Not owned or not found }
  /layouts/{layoutId}/preview-url:
    get:
      summary: Issue a short-lived no-store URL for the owned latest preview
      parameters: [{ $ref: "#/components/parameters/LayoutId" }]
      responses:
        "200": { description: Signed URL and expiry }
        "404": { description: Not owned or not found }
  /layouts/{layoutId}/confirm:
    post:
      summary: Confirm only the latest owned preview version
      parameters: [{ $ref: "#/components/parameters/LayoutId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmLayout" }
      responses:
        "201": { description: Layout approved }
        "409": { description: Stale version or concurrent approval lost }
  /admin/manual-reviews:
    get:
      summary: List pending manual reviews (ADMIN only)
      responses:
        "200": { description: Bounded pending queue }
        "403": { description: Admin required }
  /admin/manual-reviews/{reviewId}/preview-url:
    get:
      summary: Issue a short-lived review URL (ADMIN only)
      parameters: [{ $ref: "#/components/parameters/ReviewId" }]
      responses:
        "200": { description: Signed URL and expiry }
        "403": { description: Admin required }
  /admin/manual-reviews/{reviewId}/decision:
    post:
      summary: Decide a pending review exactly once (ADMIN only)
      parameters: [{ $ref: "#/components/parameters/ReviewId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualReviewDecision" }
      responses:
        "201": { description: Review applied }
        "403": { description: Admin required }
        "409": { description: Review already decided or revision changed }
  /tariffs/current:
    get:
      summary: Read the active public calculation inputs
      responses:
        "200": { description: Active UZS tariff version }
        "404": { description: No active tariff }
  /admin/tariffs:
    get:
      summary: List tariff versions (ADMIN only)
      responses:
        "200": { description: Version history }
        "403": { description: Admin required }
    post:
      summary: Retire the active tariff and publish a new version (ADMIN only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTariff" }
      responses:
        "201": { description: New active tariff version }
        "403": { description: Admin required }
  /orders:
    post:
      summary: Create an order from the latest active layout approval
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrder" }
      responses:
        "201": { description: Order and immutable PriceSnapshot }
        "404": { description: Approval not owned or not found }
        "409": { description: Stale approval, no tariff, or key conflict }
  /orders/{orderId}:
    get:
      summary: Read an owned order and frozen price/payment status
      parameters: [{ $ref: "#/components/parameters/OrderId" }]
      responses:
        "200": { description: Owned order }
        "404": { description: Not owned or not found }
  /orders/{orderId}/payment:
    post:
      summary: Start one idempotent mock payment in development/test
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartPayment" }
      responses:
        "201": { description: Pending payment and synthetic callback }
        "404": { description: Order not owned or not found }
        "409": { description: Invalid state or key conflict }
  /payments/mock/callback:
    post:
      summary: Accept a signed mock-provider callback without CSRF
      parameters:
        - in: header
          name: X-Provider-Signature
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentCallback" }
      responses:
        "201": { description: State transition accepted or replayed }
        "403": { description: Invalid signature }
        "409": { description: Replay conflict or invalid ordering }
  /admin/internal/orders/{orderId}/no-executor:
    post:
      summary: Synthetically request one full refund (ADMIN only; stage 6 hook)
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoExecutorRefund" }
      responses:
        "201": { description: Order and payment are REFUND_PENDING }
        "403": { description: Admin required }
        "409": { description: Order not refundable or key conflict }
  /admin/finance/audit:
    get:
      summary: Read bounded metadata-only financial audit (ADMIN only)
      responses:
        "200": { description: Safe audit events }
        "403": { description: Admin required }
  /admin/branches/{branchId}/capabilities:
    post:
      summary: Publish an immutable branch capability version (ADMIN only)
      parameters: [{ $ref: "#/components/parameters/BranchId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCapabilityVersion" }
      responses:
        "201": { description: New active capability version }
        "403": { description: Admin required }
  /partner/offers:
    get:
      summary: List only the authenticated partner's historical offers
      responses:
        "200": { description: Offers with partner payout but no customer data }
        "403": { description: Approved partner required }
  /partner/offers/{offerId}/decision:
    post:
      summary: Idempotently accept or reject an unexpired owned offer
      parameters:
        - $ref: "#/components/parameters/OfferId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferDecision" }
      responses:
        "201": { description: Decision committed with order CAS }
        "403": { description: Approved partner required }
        "404": { description: Offer not owned }
        "409": { description: Expired, decided, racing or key conflict }
  /partner/orders/active:
    get:
      summary: Read the authenticated partner's next active assignment
      responses:
        "200": { description: Active assignment or null }
        "403": { description: Approved partner required }
  /partner/orders/{orderId}/print-ready:
    post:
      summary: Issue a short-lived assigned print-ready URL
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201": { description: No-store signed URL }
        "403": { description: Order not assigned to partner }
  /partner/orders/{orderId}/status:
    post:
      summary: Apply the next manual production transition
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductionStatus" }
      responses:
        "201": { description: Status changed }
        "403": { description: Order not assigned to partner }
        "409": { description: Reverse, skipped or concurrent transition }
  /admin/matching:
    get:
      summary: Read bounded matching, offer and assignment history (ADMIN only)
      responses:
        "200": { description: Safe matching history }
        "403": { description: Admin required }
  /orders/{orderId}/fulfillment:
    post:
      summary: Select pickup or delivery for one owned READY order
      description: Returns a derived one-time completion PIN; plaintext PIN is never persisted.
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestFulfillment" }
      responses:
        "201": { description: Order moved to AWAITING_PICKUP }
        "404": { description: Order not owned }
        "409": { description: Order not READY or idempotency conflict }
  /couriers:
    post:
      summary: Submit a courier application
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourierApplication" }
      responses:
        "201": { description: Pending courier profile }
  /couriers/me:
    get:
      summary: Read the authenticated user's courier application
      responses:
        "200": { description: Courier profile }
        "404": { description: No courier profile }
  /admin/couriers/{courierId}/approve:
    post:
      summary: Approve a courier and grant COURIER role atomically
      parameters: [{ $ref: "#/components/parameters/CourierId" }]
      responses:
        "201": { description: Courier approved }
        "403": { description: Admin required }
        "409": { description: Courier already reviewed }
  /admin/couriers:
    get:
      summary: List bounded courier applications and status (ADMIN only)
      responses:
        "200": { description: Courier moderation queue }
        "403": { description: Admin required }
  /admin/couriers/{courierId}/suspend:
    post:
      summary: Suspend an approved courier without an active delivery
      parameters: [{ $ref: "#/components/parameters/CourierId" }]
      responses:
        "201": { description: Courier suspended }
        "403": { description: Admin required }
        "409": { description: Courier has an active delivery }
  /admin/branches/{branchId}/printer-agents:
    post:
      summary: Register one branch-local printer-agent machine identity
      description: Returns the 256-bit bearer token once; only its digest is stored.
      parameters: [{ $ref: "#/components/parameters/BranchId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterPrinterAgent" }
      responses:
        "201": { description: One-time agent credential }
        "403": { description: Admin required }
  /printer-agent/jobs/claim:
    post:
      summary: Atomically lease the next branch print job
      description: Machine-authenticated; the private PDF URL is short-lived and not persisted.
      parameters:
        - $ref: "#/components/parameters/PrinterAgentId"
        - $ref: "#/components/parameters/PrinterAgentAuthorization"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201": { description: Leased job with a no-store signed URL, or null }
        "401": { description: Invalid or revoked agent credential }
  /admin/printer-agents/{printerAgentId}/revoke:
    post:
      summary: Revoke an idle printer-agent machine credential
      parameters: [{ $ref: "#/components/parameters/PrinterAgentPathId" }]
      responses:
        "201": { description: Agent revoked }
        "403": { description: Admin required }
        "409": { description: Agent has an active leased job }
  /printer-agent/jobs/{printJobId}/status:
    post:
      summary: Report the next leased printer job transition
      parameters:
        - $ref: "#/components/parameters/PrintJobId"
        - $ref: "#/components/parameters/PrinterAgentId"
        - $ref: "#/components/parameters/PrinterAgentAuthorization"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrinterJobStatus" }
      responses:
        "201": { description: Job and order transition committed }
        "401": { description: Invalid agent credential }
        "409": { description: Lease expired or invalid transition }
  /partner/orders/{orderId}/pickup/complete:
    post:
      summary: Complete owned customer pickup with the one-time customer PIN
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmPin" }
      responses:
        "201": { description: Order moved to COMPLETED }
        "401": { description: Invalid, expired or attempt-limited PIN }
        "404": { description: Order assigned to another partner }
  /partner/deliveries/{deliveryId}/handoff:
    post:
      summary: Confirm package handoff to the assigned courier using courier PIN
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmPin" }
      responses:
        "201": { description: Order moved to IN_DELIVERY }
        "401": { description: Invalid or attempt-limited PIN }
        "404": { description: Delivery belongs to another partner }
  /courier/deliveries/active:
    get:
      summary: Read only the approved courier's active delivery
      responses:
        "200":
          description: Explicit wrapper containing the scoped delivery or null
          content:
            application/json:
              schema:
                type: object
                required: [delivery]
                properties:
                  delivery:
                    oneOf:
                      - { $ref: "#/components/schemas/CourierActiveDelivery" }
                      - { type: "null" }
        "403": { description: Approved courier required }
  /courier/deliveries/{deliveryId}/complete:
    post:
      summary: Complete an owned delivery using the customer's one-time PIN
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmPin" }
      responses:
        "201": { description: Delivery and order moved to COMPLETED }
        "401": { description: Invalid, expired or attempt-limited PIN }
        "404": { description: Delivery assigned to another courier }
  /courier/deliveries/{deliveryId}/fail:
    post:
      summary: Fail an owned active delivery with a bounded reason
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryFailure" }
      responses:
        "201": { description: Order moved to DELIVERY_FAILED }
        "404": { description: Delivery assigned to another courier }
        "409": { description: Invalid or reverse transition }
  /admin/fulfillment:
    get:
      summary: Read bounded printer, pickup and delivery operation statuses
      responses:
        "200": { description: Metadata-only operations view }
        "403": { description: Admin required }
  /health/live:
    get:
      responses: { "200": { description: Process alive } }
  /health/ready:
    get:
      responses:
        {
          "200": { description: Dependencies ready },
          "503": { description: Not ready },
        }
  /metrics:
    get:
      responses: { "200": { description: Prometheus text format } }
components:
  parameters:
    UploadId:
      in: path
      name: uploadId
      required: true
      schema: { type: string, format: uuid }
    LayoutId:
      in: path
      name: layoutId
      required: true
      schema: { type: string, format: uuid }
    ReviewId:
      in: path
      name: reviewId
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      in: path
      name: orderId
      required: true
      schema: { type: string, format: uuid }
    BranchId:
      in: path
      name: branchId
      required: true
      schema: { type: string, format: uuid }
    OfferId:
      in: path
      name: offerId
      required: true
      schema: { type: string, format: uuid }
    CourierId:
      in: path
      name: courierId
      required: true
      schema: { type: string, format: uuid }
    DeliveryId:
      in: path
      name: deliveryId
      required: true
      schema: { type: string, format: uuid }
    PrintJobId:
      in: path
      name: printJobId
      required: true
      schema: { type: string, format: uuid }
    PrinterAgentId:
      in: header
      name: X-Printer-Agent-Id
      required: true
      schema: { type: string, format: uuid }
    PrinterAgentAuthorization:
      in: header
      name: Authorization
      required: true
      schema: { type: string, pattern: "^Bearer [A-Za-z0-9_-]{43}$" }
    PrinterAgentPathId:
      in: path
      name: printerAgentId
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 16, maxLength: 200 }
  schemas:
    CreateUploadSession:
      type: object
      additionalProperties: false
      required: [extension, declaredMime, sizeBytes]
      properties:
        extension:
          type: string
          enum: [pdf, docx, jpg, jpeg, png]
        declaredMime:
          type: string
          enum:
            - application/pdf
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - image/jpeg
            - image/png
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 26214400
    UploadSession:
      type: object
      required: [id, status, expiresAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [CREATED] }
        expiresAt: { type: string, format: date-time }
    QueuedUpload:
      type: object
      required: [id, status, pageCount]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED] }
        pageCount: { type: integer, minimum: 1, maximum: 100 }
    GenerateLayout:
      type: object
      additionalProperties: false
      required: [uploadId, targetWidthMm, targetHeightMm, minDpi, photoDocument]
      properties:
        layoutId:
          type: string
          format: uuid
          description: Existing owned layout when replacing its source file.
        uploadId: { type: string, format: uuid }
        targetWidthMm: { type: integer, minimum: 10, maximum: 1000 }
        targetHeightMm: { type: integer, minimum: 10, maximum: 1000 }
        minDpi: { type: integer, minimum: 72, maximum: 1200 }
        photoDocument: { type: boolean }
    ConfirmLayout:
      type: object
      additionalProperties: false
      required: [previewVersionId]
      properties:
        previewVersionId: { type: string, format: uuid }
    ManualReviewDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [APPROVE, REJECT] }
    CreateTariff:
      type: object
      additionalProperties: false
      required: [basePriceMinor, perPagePriceMinor]
      properties:
        basePriceMinor: { type: string, pattern: "^\\d{1,15}$" }
        perPagePriceMinor: { type: string, pattern: "^\\d{1,15}$" }
    CreateOrder:
      type: object
      additionalProperties: false
      required: [layoutApprovalId, quantity]
      properties:
        layoutApprovalId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 10000 }
    StartPayment:
      type: object
      additionalProperties: false
      required: [simulateOutcome]
      properties:
        simulateOutcome: { type: string, enum: [SUCCESS, FAILURE] }
    PaymentCallback:
      type: object
      additionalProperties: false
      required: [eventId, paymentReference, outcome]
      properties:
        eventId: { type: string, format: uuid }
        paymentReference: { type: string, pattern: "^[a-f0-9]{64}$" }
        outcome:
          type: string
          enum: [PAYMENT_SUCCEEDED, PAYMENT_FAILED, REFUND_SUCCEEDED]
    NoExecutorRefund:
      type: object
      additionalProperties: false
      required: [syntheticEventReference]
      properties:
        syntheticEventReference:
          type: string
          pattern: "^[a-zA-Z0-9._:-]{1,80}$"
    CreateCapabilityVersion:
      type: object
      additionalProperties: false
      required:
        [
          supportedFileKinds,
          maxPages,
          maxWidthMm,
          maxHeightMm,
          minDpi,
          priority,
        ]
      properties:
        supportedFileKinds:
          type: array
          minItems: 1
          items: { type: string, enum: [PDF, DOCX, JPEG, PNG] }
        maxPages: { type: integer, minimum: 1, maximum: 100 }
        maxWidthMm: { type: integer, minimum: 10, maximum: 2000 }
        maxHeightMm: { type: integer, minimum: 10, maximum: 2000 }
        minDpi: { type: integer, minimum: 72, maximum: 2400 }
        priority: { type: integer, minimum: 1, maximum: 1000 }
    OfferDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [ACCEPT, REJECT] }
    ProductionStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [IN_PRODUCTION, READY] }
    RequestFulfillment:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { type: string, enum: [PICKUP, DELIVERY] }
        deliveryAddress:
          type: string
          minLength: 8
          maxLength: 500
          description: Required only for DELIVERY; encrypted before persistence.
    CourierApplication:
      type: object
      additionalProperties: false
      required: [displayName, serviceZone]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 160 }
        serviceZone: { type: string, pattern: "^[A-Z0-9_-]{2,40}$" }
    RegisterPrinterAgent:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label: { type: string, minLength: 2, maxLength: 80 }
    PrinterJobStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [PRINTING, COMPLETED, FAILED] }
        failureCode:
          type: string
          enum: [DEVICE_UNAVAILABLE, PAPER_ERROR, OUTPUT_REJECTED]
    CourierActiveDelivery:
      type: object
      additionalProperties: false
      required: [id, orderStatus, status, branchName]
      properties:
        id: { type: string, format: uuid }
        orderStatus:
          type: string
          enum: [COURIER_ASSIGNED, IN_DELIVERY]
        status: { type: string, enum: [ASSIGNED, IN_DELIVERY] }
        branchName: { type: string }
        handoffPin: { type: string, pattern: "^\\d{6}$" }
        deliveryAddress: { type: string }
    ConfirmPin:
      type: object
      additionalProperties: false
      required: [pin]
      properties:
        pin: { type: string, pattern: "^\\d{6}$" }
    DeliveryFailure:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum: [RECIPIENT_UNAVAILABLE, ADDRESS_UNREACHABLE, PACKAGE_DAMAGED]
