name: agat-print
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only}
      POSTGRES_DB: agat_print
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      {
        test: [CMD-SHELL, "pg_isready -U agat -d agat_print"],
        interval: 5s,
        timeout: 5s,
        retries: 10,
      }
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      { test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 10 }
    ports: ["6379:6379"]
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-development-only}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-development-only-change-me}
    volumes: [minio-data:/data]
    healthcheck:
      test:
        [
          CMD-SHELL,
          "mc alias set health http://localhost:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null && mc ready health",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["9000:9000", "9001:9001"]
  clamav:
    image: clamav/clamav:1.4
    healthcheck:
      test: [CMD-SHELL, "clamdscan --ping 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports: ["3310:3310"]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-development-only-change-me-at-least-32-chars}
      OTP_PROVIDER: ${OTP_PROVIDER:-mock}
      MOCK_OTP_CODE: ${MOCK_OTP_CODE:-000000}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      MOCK_PAYMENT_SECRET: ${MOCK_PAYMENT_SECRET:-development-only-mock-payment-secret}
      DATABASE_URL: postgresql://agat:${POSTGRES_PASSWORD:-development-only}@postgres:5432/agat_print?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-development-only}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-development-only-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-agat-private}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      PROCESSING_DISPATCH_ENABLED: "true"
      PREVIEW_SIGNED_URL_TTL_SECONDS: ${PREVIEW_SIGNED_URL_TTL_SECONDS:-300}
      MATCHING_DISPATCH_ENABLED: "true"
      PARTNER_OFFER_TTL_SECONDS: ${PARTNER_OFFER_TTL_SECONDS:-180}
      PARTNER_PAYOUT_BASIS_POINTS: ${PARTNER_PAYOUT_BASIS_POINTS:-8000}
      PARTNER_PAYOUT_RULE_VERSION: ${PARTNER_PAYOUT_RULE_VERSION:-mvp-v1}
      FULFILLMENT_DISPATCH_ENABLED: "true"
      AFTERCARE_DISPATCH_ENABLED: "true"
      DELIVERY_PROVIDER: ${DELIVERY_PROVIDER:-mock}
      PICKUP_PIN_SECRET: ${PICKUP_PIN_SECRET:-development-only-pickup-pin-secret}
      PICKUP_PIN_TTL_SECONDS: ${PICKUP_PIN_TTL_SECONDS:-86400}
      PICKUP_PIN_MAX_ATTEMPTS: ${PICKUP_PIN_MAX_ATTEMPTS:-5}
      DELIVERY_DATA_KEY: ${DELIVERY_DATA_KEY:-ZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGQ=}
      PRINTER_AGENT_TOKEN_PEPPER: ${PRINTER_AGENT_TOKEN_PEPPER:-development-only-printer-agent-token-pepper}
      PRINTER_AGENT_LEASE_SECONDS: ${PRINTER_AGENT_LEASE_SECONDS:-120}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      clamav: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:4000/api/v1/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    ports: ["4000:4000"]
  processing-runtime:
    profiles: [processing]
    image: agat-processing:local
    build: { context: ops/processing, dockerfile: Dockerfile }
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=ops/processing/seccomp.json
    pids_limit: 64
    mem_limit: 768m
    cpus: 1
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=65532,gid=65532
    entrypoint: ["true"]
  processing-worker:
    profiles: [processing]
    build: { context: ., dockerfile: ops/processing/worker.Dockerfile }
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-development-only-change-me-at-least-32-chars}
      OTP_PROVIDER: ${OTP_PROVIDER:-mock}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      MOCK_PAYMENT_SECRET: ${MOCK_PAYMENT_SECRET:-development-only-mock-payment-secret}
      DATABASE_URL: postgresql://agat:${POSTGRES_PASSWORD:-development-only}@postgres:5432/agat_print?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-development-only}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-development-only-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-agat-private}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      PROCESSING_DISPATCH_ENABLED: "false"
      PROCESSING_IMAGE: agat-processing:local
      PROCESSING_RUNNER_SCRIPT: /app/ops/processing/run-job.sh
      PROCESSING_SECCOMP_PROFILE: /app/ops/processing/seccomp.json
      PROCESSING_TIMEOUT_SECONDS: 120
      PREVIEW_SIGNED_URL_TTL_SECONDS: ${PREVIEW_SIGNED_URL_TTL_SECONDS:-300}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      clamav: { condition: service_healthy }
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_ORIGIN: http://localhost:4000
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    ports: ["3000:3000"]
  printer-agent:
    profiles: [printer-agent]
    build: { context: ., dockerfile: apps/printer-agent/Dockerfile }
    environment:
      AGAT_API_ORIGIN: http://api:4000
      PRINTER_AGENT_ID: ${PRINTER_AGENT_ID:-00000000-0000-0000-0000-000000000000}
      PRINTER_AGENT_TOKEN: ${PRINTER_AGENT_TOKEN:-development-only}
      PRINTER_SPOOL_DIRECTORY: /spool
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/spool:rw, nosuid, nodev, noexec, size=64m, uid=1000, gid=1000]
    depends_on: { api: { condition: service_healthy } }
  backup:
    profiles: [backup]
    build: { context: ., dockerfile: ops/backup/Dockerfile }
    env_file:
      - path: .env
        required: false
    environment:
      PGHOST: postgres
      PGUSER: agat
      PGDATABASE: agat_print
      PGPASSWORD: ${POSTGRES_PASSWORD:-development-only}
      MINIO_ALIAS_URL: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-agat-private}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-development-only}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-development-only-change-me}
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    entrypoint: ["/opt/agat/backup.sh"]
volumes:
  postgres-data:
  minio-data:
